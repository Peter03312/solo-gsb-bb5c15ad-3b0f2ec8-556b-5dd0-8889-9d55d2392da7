services:
  park-route:
    build: .
    image: park-route-planner:latest
    container_name: park-route-planner
    ports:
      - "8080:8080"
    environment:
      PARK_DB_PATH: /data/park.db
      PARK_HOST: 0.0.0.0
      PARK_PORT: "8080"
      PARK_THREADS: "8"
      PARK_SEED_GRAPH: /app/seed/graph.json
      PARK_SEED_CLOSURES: /app/seed/closures.json
    volumes:
      - park-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  park-data:
